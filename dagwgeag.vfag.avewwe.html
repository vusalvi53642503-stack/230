<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FODPSFIN</title>
    <!-- 
      HOW TO ADD A NEW PAGE:
      1. Define a new Vue component for the page.
      2. Add a new route configuration in the router object under the routes array.
      3. If it's a main tab page, add a corresponding <router-link> in the Bottom Tab Bar component.
    -->
    <!-- Vue 3 Global Production Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    
    <style>
        /* Style 6: Glassmorphism / Frosted Glass Theme */
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        @media (min-width: 481px) {
            #app {
                border-radius: 40px;
                border: 8px solid #334155;
                height: 844px;
            }
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: env(safe-area-inset-top, 16px) 16px calc(80px + env(safe-area-inset-bottom, 16px)) 16px;
            -webkit-overflow-scrolling: touch;
        }

        .view-container.no-tab {
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 16px));
        }

        /* Glass Card Utility */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-glass);
            margin-bottom: 16px;
        }

        /* Tab Bar */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(64px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            transition: color 0.2s;
            width: 33.33%;
            height: 100%;
            justify-content: center;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        .tab-item.router-link-active {
            color: var(--primary);
        }

        /* Loading View */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Typography & Common Components */
        h1, h2, h3 { font-weight: 600; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 14px; }

        .btn {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        input, select, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .badge-green { color: var(--accent-green); background: rgba(16, 185, 129, 0.15); padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; }
        .badge-red { color: var(--accent-red); background: rgba(244, 63, 94, 0.15); padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; }

        /* Transitions */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.15s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 2000;
            box-shadow: var(--shadow-glass);
            animation: fadeInOut 2s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const { createApp, ref, computed, onMounted, reactive } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // Built-in Stock Database (20+ items)
        const stockDatabase = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 185.92, change: +1.25, history: [180, 182, 181, 184, 183, 185, 185.92] },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.50, change: +0.85, history: [410, 412, 411, 414, 413, 414, 415.5] },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 142.65, change: -0.45, history: [145, 144, 143, 144, 142, 143, 142.65] },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.25, change: +2.10, history: [170, 172, 174, 175, 176, 177, 178.25] },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 788.17, change: +4.35, history: [750, 760, 770, 765, 780, 785, 788.17] },
            { symbol: 'META', name: 'Meta Platforms', price: 485.40, change: -1.15, history: [495, 490, 488, 492, 486, 487, 485.4] },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 202.64, change: -3.20, history: [215, 210, 208, 206, 204, 205, 202.64] },
            { symbol: 'JPM', name: 'JPMorgan Chase', price: 182.10, change: +0.40, history: [180, 181, 180, 181, 182, 181, 182.1] },
            { symbol: 'V', name: 'Visa Inc.', price: 279.80, change: +0.15, history: [278, 279, 278, 279, 280, 279, 279.8] },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 158.40, change: -0.25, history: [159, 158, 158.5, 159, 158, 158.2, 158.4] },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 165.30, change: +0.90, history: [163, 164, 164.5, 165, 164.8, 165, 165.3] },
            { symbol: 'MA', name: 'Mastercard Inc.', price: 458.20, change: +1.10, history: [450, 452, 455, 456, 457, 458, 458.2] },
            { symbol: 'PG', name: 'Procter & Gamble', price: 159.90, change: -0.10, history: [160, 159.5, 160, 159.8, 159.9, 159.7, 159.9] },

            { symbol: 'HD', name: 'Home Depot', price: 365.40, change: +0.65, history: [360, 362, 363, 364, 363.5, 364.8, 365.4] },
            { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.30, change: -1.80, history: [115, 114, 113.5, 113, 112.8, 112.5, 112.3] },
            { symbol: 'NFLX', name: 'Netflix Inc.', price: 598.70, change: +2.85, history: [580, 585, 590, 588, 592, 595, 598.7] },
            { symbol: 'INTC', name: 'Intel Corp.', price: 43.20, change: -2.40, history: [45, 44.5, 44, 43.8, 43.5, 43.3, 43.2] },
            { symbol: 'AMD', name: 'Advanced Micro Devices', price: 178.90, change: +3.15, history: [170, 172, 175, 174, 177, 178, 178.9] },
            { symbol: 'PYPL', name: 'PayPal Holdings', price: 62.40, change: -0.75, history: [64, 63.5, 63, 63.2, 62.8, 62.5, 62.4] }
        ];

        // Global Utility for Global Toast
        const globalToast = ref('');
        function showToast(msg) {
            globalToast.value = msg;
            setTimeout(() => { if(globalToast.value === msg) globalToast.value = ''; }, 2000);
        }

        // --- Components ---

        // 1. Loading Component
        const LoadingView = {
            template: `
                <div class="loading-screen">
                    <div class="spinner"></div>
                    <h2>FODPSFIN</h2>
                    <p style="margin-top: 8px;">Initializing secure session...</p>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // Requirement 1.2 strict block
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://g7233vp7bg6ojoipcuqzqqq7te0xlqxu.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "dagwgeag.vfag.avewwe";
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // 2. Home Component
        const HomeView = {
            template: `
                <div class="view-container">
                    <!-- Brand Header -->
                    <div class="glass-card" style="display: flex; align-items: center; gap: 16px;">
                        <img src="https://admin.ytsevbr.xyz/api/apps/318/icon" style="width: 50px; height: 50px; border-radius: 12px; object-fit: cover;" alt="logo" />
                        <div>
                            <h2>FODPSFIN</h2>
                            <p>Smart Financial Intelligence Terminal</p>
                        </div>
                    </div>

                    <!-- 4 Random Feature Icons -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;">
                        <div v-for="feat in selectedFeatures" :key="feat.id" @click="goToSub(feat.id)" class="glass-card" style="padding: 12px 8px; text-align: center; margin-bottom: 0; cursor: pointer;">
                            <div v-html="feat.svg" style="width: 28px; height: 28px; margin: 0 auto 6px auto; color: var(--primary);"></div>
                            <span style="font-size: 11px; color: var(--text-main); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ feat.name }}</span>
                        </div>
                    </div>

                    <!-- Stock List -->
                    <h3 style="margin-bottom: 12px;">Market Overview</h3>
                    <div v-for="stock in shuffledStocks" :key="stock.symbol" @click="viewDetail(stock)" class="glass-card" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;">
                        <div>
                            <div style="font-weight: 600; font-size: 15px;">{{ stock.symbol }}</div>
                            <div style="font-size: 12px; color: var(--text-muted);">{{ stock.name }}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 600; font-size: 15px;">$\\\{{ stock.price.toFixed(2) }}</div>
                            <span :class="stock.change >= 0 ? 'badge-green' : 'badge-red'">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                            </span>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // 8 Available features
                const allFeatures = [
                    { id: 'gainers', name: 'Top Gainers', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>' },
                    { id: 'losers', name: 'Top Losers', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z"/></svg>' },
                    { id: 'active', name: 'Most Active', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8m1-13h-2v6l5.25 3.15.75-1.23-4.5-2.67Z"/></svg>' },
                    { id: 'potential', name: 'Potential', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2m1 15h-2v-6h2m0-4h-2V7h2Z"/></svg>' },
                    { id: 'picks', name: 'Top Picks', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>' },
                    { id: 'guide', name: 'Guide', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2m-5 14H7v-2h7v2m3-4H7v-2h10v2m0-4H7V7h10v2Z"/></svg>' },
                    { id: 'notrec', name: 'Avoid', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m1 15h-2v-2h2m0-4h-2V7h2Z"/></svg>' },
                    { id: 'watchlist', name: 'Watchlist', svg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' }
                ];

                // Randomly pick 4 features fixed at initialization
                const selectedFeatures = ref([]);
                const shuffledStocks = ref([...stockDatabase]);

                onMounted(() => {
                    // Seed-based or random shuffle for 4 features
                    const shuffled = [...allFeatures].sort(() => 0.5 - Math.random());
                    selectedFeatures.value = shuffled.slice(0, 4);
                    // Shuffle presentation order of stocks
                    shuffledStocks.value = [...stockDatabase].sort(() => 0.5 - Math.random());
                });

                function goToSub(id) {
                    router.push({ name: 'SubPage', params: { type: id } });
                }

                function viewDetail(stock) {
                    router.push({ name: 'StockDetail', query: { symbol: stock.symbol } });
                }

                return { selectedFeatures, shuffledStocks, goToSub, viewDetail };
            }
        };

        // Sub Page for Features
        const SubPageView = {
            template: `
                <div class="view-container no-tab">
                    <div style="display: flex; align-items: center; margin-bottom: 16px; gap: 12px;">
                        <button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px;">Back</button>
                        <h2>{{ pageTitle }}</h2>
                    </div>

                    <div v-if="type === 'guide'" class="glass-card">
                        <h3 style="margin-bottom: 8px;">Macro Financial Outlook 2026</h3>
                        <p style="line-height: 1.6; margin-bottom: 12px;">Navigating modern markets requires strict risk management, diversified asset allocation, and algorithmic discipline. As monetary policies shift globally, technology leaders and sustainable sectors remain primary drivers of institutional capital.</p>
                        <p style="line-height: 1.6;">Always maintain emergency liquidity and evaluate risk-reward ratios meticulously before committing capital to volatile instruments.</p>
                    </div>

                    <div v-else>
                        <div v-for="stock in displayList" :key="stock.symbol" class="glass-card" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 10px;">
                            <div>
                                <div style="font-weight: 600; font-size: 15px;">{{ stock.symbol }}</div>
                                <div style="font-size: 12px; color: var(--text-muted);">{{ stock.name }}</div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-weight: 600; font-size: 15px;">$\\\{{ stock.price.toFixed(2) }}</div>
                                <span :class="stock.change >= 0 ? 'badge-green' : 'badge-red'">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const type = route.params.type;
                
                const titles = {
                    gainers: 'Top Gainers',
                    losers: 'Top Losers',
                    active: 'Most Active',
                    potential: 'Potential Growth',
                    picks: 'Top Picks',
                    guide: 'Financial Guide',
                    notrec: 'Avoid List',
                    watchlist: 'Watchlist'
                };

                const pageTitle = titles[type] || 'Market Data';
                const displayList = ref([]);

                onMounted(() => {
                    let list = [...stockDatabase];
                    if (type === 'gainers') {
                        list.sort((a,b) => b.change - a.change);
                        displayList.value = list.slice(0, 10);
                    } else if (type === 'losers') {
                        list.sort((a,b) => a.change - b.change);
                        displayList.value = list.slice(0, 5);
                    } else if (type === 'active') {
                        displayList.value = list.sort(() => 0.5 - Math.random()).slice(0, 8);
                    } else if (type === 'potential') {
                        displayList.value = list.sort(() => 0.5 - Math.random()).slice(0, 6);
                    } else if (type === 'picks' || type === 'watchlist') {
                        displayList.value = list.sort(() => 0.5 - Math.random()).slice(0, 10);
                    } else if (type === 'notrec') {
                        list.sort((a,b) => a.change - b.change);
                        displayList.value = list.slice(0, 10);
                    }
                });

                return { type, pageTitle, displayList };
            }
        };

        // Stock Detail Page with SVG Chart
        const StockDetailView = {
            template: `
                <div class="view-container no-tab">
                    <div style="display: flex; align-items: center; margin-bottom: 16px; gap: 12px;">
                        <button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px;">Back</button>
                        <h2>{{ stock.symbol }} Details</h2>
                    </div>

                    <div class="glass-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <div>
                                <h3 style="font-size: 20px;">{{ stock.name }}</h3>
                                <p>{{ stock.symbol }} / USD</p>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 22px; font-weight: 700;">$\\\{{ stock.price.toFixed(2) }}</div>
                                <span :class="stock.change >= 0 ? 'badge-green' : 'badge-red'">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </span>
                            </div>
                        </div>

                        <h4 style="margin-bottom: 8px; font-size: 14px; color: var(--text-muted);">1-Month Price Trend</h4>
                        <div style="width: 100%; height: 180px; background: rgba(15, 23, 42, 0.4); border-radius: 12px; padding: 10px; position: relative;">
                            <svg :viewBox="'0 0 300 150'" preserveAspectRatio="none" style="width: 100%; height: 100%;">
                                <polyline
                                    :points="svgPoints"
                                    fill="none"
                                    stroke="var(--primary)"
                                    stroke-width="3"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const symbol = route.query.symbol || 'AAPL';
                const stock = stockDatabase.find(s => s.symbol === symbol) || stockDatabase[0];

                const svgPoints = computed(() => {
                    const data = stock.history;
                    const min = Math.min(...data);
                    const max = Math.max(...data);
                    const range = max - min === 0 ? 1 : max - min;
                    const width = 300;
                    const height = 150;
                    
                    return data.map((val, idx) => {
                        const x = (idx / (data.length - 1)) * width;
                        const y = height - ((val - min) / range) * (height - 20) - 10;
                        return `\\\${x},\\\${y}`;
                    }).join(' ');
                });

                return { stock, svgPoints };
            }
        };

        // 3. Toolbox Component
        const ToolboxView = {
            template: `
                <div class="view-container">
                    <h2 style="margin-bottom: 16px;">Financial Toolbox</h2>

                    <!-- Tool 1: DCA Profit-Taking -->
                    <div class="glass-card">
                        <h3>DCA Profit-Taking Calculator</h3>
                        <p style="margin-bottom: 12px;">Calculate instant return status.</p>
                        <input type="number" v-model.number="dca.cost" placeholder="Average Cost" />
                        <input type="number" v-model.number="dca.shares" placeholder="Holding Shares" />
                        <input type="number" v-model.number="dca.target" placeholder="Target Price" />
                        <button @click="calcDca" class="btn">Calculate Profit</button>
                        <div v-if="dca.result !== null" style="margin-top: 12px; font-weight: 600;">
                            Estimated Return: $\\\{{ dca.result.toFixed(2) }} (\\\{{ dca.pct.toFixed(2) }}%)
                        </div>
                    </div>

                    <!-- Tool 2: Wealth Calendar -->
                    <div class="glass-card">
                        <h3>Wealth Calendar</h3>
                        <p style="margin-bottom: 12px;">Track maturity milestones.</p>
                        <input type="date" v-model="cal.date" />
                        <input type="text" v-model="cal.title" placeholder="Milestone Description" />
                        <button @click="addMilestone" class="btn">Add Milestone</button>
                        <div style="margin-top: 12px;">
                            <div v-for="(m, idx) in cal.list" :key="idx" style="font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--card-border);">
                                <strong>\\\${m.date}</strong>: \\\${m.title}
                            </div>
                        </div>
                    </div>

                    <!-- Tool 3: Loan Calculator -->
                    <div class="glass-card">
                        <h3>Loan Calculator</h3>
                        <p style="margin-bottom: 12px;">Amortization schedule (Principal & Interest).</p>
                        <input type="number" v-model.number="loan.amount" placeholder="Loan Amount" />
                        <input type="number" v-model.number="loan.rate" placeholder="Annual Rate (%)" />
                        <input type="number" v-model.number="loan.months" placeholder="Months" />
                        <button @click="calcLoan" class="btn">Calculate Monthly Payment</button>
                        <div v-if="loan.monthlyPayment !== null" style="margin-top: 12px; font-weight: 600;">
                            Monthly Payment: $\\\{{ loan.monthlyPayment.toFixed(2) }}
                        </div>
                    </div>

                    <!-- Tool 4: Profit Calculator -->
                    <div class="glass-card">
                        <h3>Profit Calculator</h3>
                        <input type="number" v-model.number="profit.cost" placeholder="Unit Cost" />
                        <input type="number" v-model.number="profit.price" placeholder="Selling Price" />
                        <input type="number" v-model.number="profit.qty" placeholder="Quantity Sold" />
                        <button @click="calcProfit" class="btn">Calculate Net Profit</button>
                        <div v-if="profit.total !== null" style="margin-top: 12px; font-weight: 600;">
                            Net Profit: $\\\{{ profit.total.toFixed(2) }}
                        </div>
                    </div>

                    <!-- Tool 5: Reverse Yield -->
                    <div class="glass-card">
                        <h3>Reverse Yield Calculator</h3>
                        <input type="number" v-model.number="rev.target" placeholder="Target Amount" />
                        <input type="number" v-model.number="rev.principal" placeholder="Initial Principal" />
                        <input type="number" v-model.number="rev.years" placeholder="Years" />
                        <button @click="calcRev" class="btn">Calculate Required APY</button>
                        <div v-if="rev.apy !== null" style="margin-top: 12px; font-weight: 600;">
                            Required APY: \\\${rev.apy.toFixed(2)}%
                        </div>
                    </div>

                    <!-- Tool 6: Password Strength & MD5 -->
                    <div class="glass-card">
                        <h3>Password Strength & MD5</h3>
                        <input type="password" v-model="pwd.val" placeholder="Enter financial password" />
                        <button @click="checkPwd" class="btn">Check Strength & Hash</button>
                        <div v-if="pwd.hash" style="margin-top: 12px; font-size: 12px; word-break: break-all;">
                            <div>Strength: <strong>\\\${pwd.strength}</strong></div>
                            <div>MD5 Hash: \\\${pwd.hash}</div>
                        </div>
                    </div>

                    <!-- Tool 7: Credit Memo -->
                    <div class="glass-card">
                        <h3>Credit Memo</h3>
                        <input type="text" v-model="memo.debtor" placeholder="Debtor Name" />
                        <input type="number" v-model.number="memo.amount" placeholder="Amount Due" />
                        <input type="date" v-model="memo.dueDate" />
                        <button @click="addMemo" class="btn">Save Credit Note</button>
                        <div style="margin-top: 12px;">
                            <div v-for="(item, i) in memo.list" :key="i" style="font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--card-border);">
                                \\\${item.debtor}: $\\\{{ item.amount }} (Due: \\\${item.dueDate})
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const dca = reactive({ cost: null, shares: null, target: null, result: null, pct: null });
                function calcDca() {
                    if (!dca.cost || !dca.shares || !dca.target) return;
                    dca.result = (dca.target - dca.cost) * dca.shares;
                    dca.pct = ((dca.target - dca.cost) / dca.cost) * 100;
                }

                const cal = reactive({ date: '', title: '', list: [] });
                function addMilestone() {
                    if (!cal.date || !cal.title) return;
                    cal.list.push({ date: cal.date, title: cal.title });
                    cal.date = ''; cal.title = '';
                }

                const loan = reactive({ amount: null, rate: null, months: null, monthlyPayment: null });
                function calcLoan() {
                    if (!loan.amount || !loan.rate || !loan.months) return;
                    const r = loan.rate / 100 / 12;
                    const n = loan.months;
                    const p = loan.amount;
                    loan.monthlyPayment = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                }

                const profit = reactive({ cost: null, price: null, qty: null, total: null });
                function calcProfit() {
                    if (profit.cost === null || profit.price === null || !profit.qty) return;
                    profit.total = (profit.price - profit.cost) * profit.qty;
                }

                const rev = reactive({ target: null, principal: null, years: null, apy: null });
                function calcRev() {
                    if (!rev.target || !rev.principal || !rev.years) return;
                    rev.apy = (Math.pow(rev.target / rev.principal, 1 / rev.years) - 1) * 100;
                }

                const pwd = reactive({ val: '', strength: '', hash: '' });
                function checkPwd() {
                    if (!pwd.val) return;
                    pwd.hash = md5(pwd.val);
                    if (pwd.val.length > 8 && /[A-Z]/.test(pwd.val) && /[0-9]/.test(pwd.val)) {
                        pwd.strength = 'Strong';
                    } else if (pwd.val.length >= 6) {
                        pwd.strength = 'Moderate';
                    } else {
                        pwd.strength = 'Weak';
                    }
                }

                const memo = reactive({ debtor: '', amount: null, dueDate: '', list: [] });
                function addMemo() {
                    if (!memo.debtor || !memo.amount || !memo.dueDate) return;
                    memo.list.push({ debtor: memo.debtor, amount: memo.amount, dueDate: memo.dueDate });
                    memo.debtor = ''; memo.amount = null; memo.dueDate = '';
                }

                return { dca, calcDca, cal, addMilestone, loan, calcLoan, profit, calcProfit, rev, calcRev, pwd, checkPwd, memo, addMemo };
            }
        };

        // 4. Settings Component
        const SettingsView = {
            template: `
                <div class="view-container">
                    <h2 style="margin-bottom: 16px;">Settings & Profile</h2>
                    
                    <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                        <router-link to="/settings/version" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>Version Information</span><span>v2.6.0 ></span>
                        </router-link>
                        <router-link to="/settings/privacy" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>Privacy Policy</span><span>></span>
                        </router-link>
                        <router-link to="/settings/terms" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>Terms of Service</span><span>></span>
                        </router-link>
                        <router-link to="/settings/team" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>About Team</span><span>></span>
                        </router-link>
                        <a href="mailto:dagwgeag.vfag.avewwe@gmail.com" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>Contact Us</span><span>></span>
                        </a>
                        <router-link to="/settings/checkin" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>Monthly Check-in</span><span>></span>
                        </router-link>
                        <router-link to="/settings/feedback" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>Customer Feedback</span><span>></span>
                        </router-link>
                        <router-link to="/settings/inbox" style="color: var(--text-main); text-decoration: none; display: flex; justify-content: space-between;">
                            <span>Inbox</span><span>></span>
                        </router-link>
                    </div>
                </div>
            `
        };

        // Sub Settings Pages
        const VersionView = {
            template: '<div class="view-container no-tab"><button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px; margin-bottom: 16px;">Back</button><div class="glass-card"><h3>Version 2.6.0</h3><p style="margin-top: 8px;">Stable production release with optimized Glassmorphism UI and advanced local financial calculators.</p></div></div>'
        };

        const PrivacyView = {
            template: '<div class="view-container no-tab"><button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px; margin-bottom: 16px;">Back</button><div class="glass-card"><h3>Privacy Policy</h3><p style="margin-top: 8px; line-height: 1.6;">We value your data sovereignty. All computations, calculators, and records are stored locally on your device storage without external telemetry transmission.</p></div></div>'
        };

        const TermsView = {
            template: '<div class="view-container no-tab"><button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px; margin-bottom: 16px;">Back</button><div class="glass-card"><h3>Terms of Service</h3><p style="margin-top: 8px; line-height: 1.6;">By accessing and utilizing FODPSFIN, you agree to use our local calculation utilities responsibly. Financial estimates provided are for analytical reference only.</p></div></div>'
        };

        const TeamView = {
            template: '<div class="view-container no-tab"><button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px; margin-bottom: 16px;">Back</button><div class="glass-card"><h3>About Team</h3><p style="margin-top: 8px; line-height: 1.6;">We are a dedicated collective of mobile engineers, quantitative analysts, and UI designers building uncompromising high-performance web applications.</p></div></div>'
        };

        const CheckinView = {
            template: `
                <div class="view-container no-tab">
                    <button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px; margin-bottom: 16px;">Back</button>
                    <div class="glass-card" style="text-align: center;">
                        <h3>Monthly Check-in</h3>
                        <p style="margin: 8px 0 16px 0;">Build consistent financial review habits.</p>
                        <button @click="checkin" class="btn" :disabled="checked">\\\${checked ? 'Checked In Today' : 'Check In Now'}</button>
                    </div>
                </div>
            `,
            setup() {
                const checked = ref(localStorage.getItem('checked_in') === 'true');
                function checkin() {
                    localStorage.setItem('checked_in', 'true');
                    checked.value = true;
                    showToast('Check-in successful!');
                }
                return { checked, checkin };
            }
        };

        const FeedbackView = {
            template: `
                <div class="view-container no-tab">
                    <button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px; margin-bottom: 16px;">Back</button>
                    <div class="glass-card">
                        <h3>Customer Feedback</h3>
                        <p style="margin: 8px 0 16px 0;">Send us your thoughts.</p>
                        <input type="text" v-model="title" placeholder="Subject Title" />
                        <textarea v-model="content" placeholder="Describe your feedback..." rows="4" style="width: background; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 12px; color: var(--text-main); font-size: 14px; margin-bottom: 12px; outline: none; width: 100%;"></textarea>
                        <button @click="send" class="btn" :disabled="!title || !content">Send Feedback</button>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const title = ref('');
                const content = ref('');
                function send() {
                    if (!title.value || !content.value) return;
                    showToast('Feedback sent successfully!');
                    title.value = ''; content.value = '';
                    setTimeout(() => router.back(), 1000);
                }
                return { title, content, send };
            }
        };

        const InboxView = {
            template: `
                <div class="view-container no-tab">
                    <button @click="$router.back()" class="btn" style="width: auto; padding: 8px 14px; margin-bottom: 16px;">Back</button>
                    <div class="glass-card" @click="showMsg = true" style="cursor: pointer;">
                        <h3>Welcome to FODPSFIN</h3>
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Tap to read message</p>
                    </div>
                    <div v-if="showMsg" class="glass-card" style="border-color: var(--primary);">
                        <h3>Message Details</h3>
                        <p style="margin-top: 8px; line-height: 1.5;">Welcome! Your secure financial terminal is fully initialized. Explore tools and market data with absolute confidence.</p>
                        <button @click="showMsg = false" class="btn" style="margin-top: 12px;">Close</button>
                    </div>
                </div>
            `,
            setup() {
                const showMsg = ref(false);
                return { showMsg };
            }
        };

        // Main Layout App Template with Tab Bar & Transition
        const AppLayout = {
            template: `
                <div style="display: flex; flex-direction: column; height: 100%; position: relative;">
                    <router-view v-slot="{ Component }">
                        <transition name="fade" mode="out-in">
                            <component :is="Component" />
                        </transition>
                    </router-view>

                    <!-- Bottom Tab Bar (Hidden on subpages and loading) -->
                    <div v-if="showTabBar" class="tab-bar">
                        <router-link to="/home" class="tab-item">
                            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                            Home
                        </router-link>
                        <router-link to="/toolbox" class="tab-item">
                            <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                            Toolbox
                        </router-link>
                        <router-link to="/settings" class="tab-item">
                            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                            Settings
                        </router-link>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => {
                    return ['/home', '/toolbox', '/settings'].includes(route.path);
                });
                return { showTabBar };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingView },
            { 
                path: '/', 
                component: AppLayout,
                children: [
                    { path: 'home', component: HomeView },
                    { path: 'sub/:type', name: 'SubPage', component: SubPageView },
                    { path: 'stock-detail', name: 'StockDetail', component: StockDetailView },
                    { path: 'toolbox', component: ToolboxView },
                    { path: 'settings', component: SettingsView },
                    { path: 'settings/version', component: VersionView },
                    { path: 'settings/privacy', component: PrivacyView },
                    { path: 'settings/terms', component: TermsView },
                    { path: 'settings/team', component: TeamView },
                    { path: 'settings/checkin', component: CheckinView },
                    { path: 'settings/feedback', component: FeedbackView },
                    { path: 'settings/inbox', component: InboxView }
                ]
            }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // Root App Instance
        const app = createApp({
            template: `
                <router-view />
                <div v-if="globalToast" class="toast">\\\${globalToast}</div>
            `,
            setup() {
                return { globalToast };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
